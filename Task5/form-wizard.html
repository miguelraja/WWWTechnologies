<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Form Wizard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2 class="mb-4">User Registration Wizard</h2>

        <div id="alert-area"></div>
        
        <div id="wizard">
            <ul class="nav nav-tabs mb-4" id="wizardTabs" role="tablist">
                <li class="nav-item">
                    <button class="nav-link active" id="step1-tab" data-bs-toggle="tab" data-bs-target="#step1" type="button" role="tab">
                        Step 1
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" id="step2-tab" data-bs-toggle="tab" data-bs-target="#step2" type="button" role="tab">
                        Step 2
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" id="step3-tab" data-bs-toggle="tab" data-bs-target="#step3" type="button" role="tab">
                        Step 3
                    </button>
                </li>
            </ul>

            <div class="tab-content">
                <div class="tab-pane fade show active" id="step1">
                    <p>Step 1 content.</p>
                </div>

                <div class="tab-pane fade" id="step2">
                    <p>Step 2 content.</p>
                </div>

                <div class="tab-pane fade" id="step3">
                    <p>Step 3 content.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/wizard.js"></script>
</body>
</html>
